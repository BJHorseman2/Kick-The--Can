# Records the radio voice bank with text-to-speech and commits the clips to
# the branch you run it from. One-time setup: add the provider's key as a
# repository secret (Settings → Secrets and variables → Actions):
#   OpenAI      → OPENAI_API_KEY   (OPENAI also accepted)
#   ElevenLabs  → ELEVENLABS_API_KEY (ELEVENLABS / ELEVEN also accepted)
# Then: Actions → "Record radio voice bank" → Run workflow, pick the branch
# (claude/sky-heist-variation), choose the provider and voices, and go.
name: Record radio voice bank

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bank = record the game''s lines; audition = sample many ElevenLabs voices for the /audition page'
        type: choice
        options: [bank, audition]
        default: 'bank'
        required: true
      provider:
        description: 'Text-to-speech provider'
        type: choice
        options: [elevenlabs, openai]
        default: 'elevenlabs'
        required: true
      overlord_voice:
        description: 'Voice for OVERLORD — ElevenLabs: a voice name (Adam, Daniel, Brian, George, Roger…) or id; OpenAI: ash, ballad, verse, echo, onyx…'
        default: 'Adam'
        required: false
      wingman_voice:
        description: 'Voice for VIPER 2 — ElevenLabs: Chris, Will, Eric, Liam… ; OpenAI: verse, echo, ash…'
        default: 'Chris'
        required: false
      force:
        description: 'Re-record every line, even unchanged ones (true/false)'
        default: 'false'
        required: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record clips
        env:
          PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI || vars.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS || secrets.ELEVEN || vars.ELEVENLABS_API_KEY }}
        run: |
          if [ "$PROVIDER" = "elevenlabs" ] && [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::No ElevenLabs key reached this run. Add it as a repository secret named ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions → Secrets → New repository secret)."
            exit 1
          fi
          if [ "$PROVIDER" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::No OpenAI key reached this run. Add it as a repository secret named OPENAI_API_KEY."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "audition" ]; then
            node scripts/audition-voices.mjs
            exit 0
          fi
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          node scripts/generate-voice.mjs --provider="$PROVIDER" --overlord="${{ inputs.overlord_voice }}" --wingman="${{ inputs.wingman_voice }}" $FORCE
      - name: Commit the clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/voice public/voice-audition 2>/dev/null || git add -A public/voice
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "audition" ]; then
            git commit -m "Record voice audition samples (ElevenLabs)"
          else
            git commit -m "Record radio voice bank (${{ inputs.provider }}: ${{ inputs.overlord_voice }} / ${{ inputs.wingman_voice }})"
          fi
          # the branch may have moved while we recorded: replay on top
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
