<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WorkNotes</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f4;
      --text: #11151c; --text-dim: #6b7280; --border: #e2e5ea;
      --accent: #2f6bff; --accent-soft: rgba(47,107,255,0.12); --danger: #e5484d;
      --shadow: 0 1px 3px rgba(16,21,28,0.08), 0 6px 18px rgba(16,21,28,0.06);
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0b0f17; --surface:#151b26; --surface-2:#1d2533; --text:#eef1f6;
        --text-dim:#8b94a3; --border:#232c3b; --accent:#5b8bff;
        --accent-soft:rgba(91,139,255,0.18); --danger:#ff6b6f;
        --shadow:0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
    #app { min-height:100%; display:flex; flex-direction:column; }
    .app-header { position:sticky; top:0; z-index:10; padding:calc(var(--safe-top) + 12px) 16px 8px;
      background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
      border-bottom:1px solid var(--border); }
    .header-row { display:flex; align-items:center; justify-content:space-between; }
    .app-title { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em; }
    .search-wrap { margin-top:12px; }
    .search { width:100%; border:none; background:var(--surface-2); color:var(--text);
      font-size:16px; padding:11px 14px; border-radius:12px; outline:none; }
    .search::placeholder { color:var(--text-dim); }
    .tag-filter { display:flex; gap:8px; overflow-x:auto; margin-top:10px; padding-bottom:2px; scrollbar-width:none; }
    .tag-filter::-webkit-scrollbar { display:none; }
    .tag-chip { flex:0 0 auto; border:1px solid var(--border); background:var(--surface);
      color:var(--text-dim); font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; }
    .tag-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .note-list { flex:1; padding:12px 16px calc(var(--safe-bottom) + 32px); display:flex; flex-direction:column; gap:10px; }
    .note-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; transition:transform .06s ease; }
    .note-card:active { transform:scale(0.985); }
    .note-card .nc-top { display:flex; align-items:center; gap:8px; }
    .note-card h3 { margin:0; font-size:17px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .note-card .pin-dot { color:var(--accent); font-size:14px; }
    .note-card p { margin:6px 0 0; color:var(--text-dim); font-size:14px; line-height:1.4;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .note-card .nc-meta { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    .note-card time { font-size:12px; color:var(--text-dim); }
    .nc-tag { font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:6px; }
    .empty-state { text-align:center; color:var(--text-dim); margin:25vh auto; font-size:16px; line-height:1.6; }
    .icon-btn { border:none; background:var(--surface-2); color:var(--text); width:40px; height:40px;
      border-radius:50%; font-size:20px; display:grid; place-items:center; cursor:pointer; }
    .icon-btn.primary { background:var(--accent); color:#fff; font-weight:700; }
    .icon-btn.danger { color:var(--danger); }
    .text-btn { border:none; background:none; color:var(--text); font-size:16px; cursor:pointer; padding:6px 4px; }
    .text-btn.primary { color:var(--accent); font-weight:700; }
    .editor { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;
      animation:slideUp .22s ease; }
    @keyframes slideUp { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    .editor-bar { display:flex; align-items:center; justify-content:space-between;
      padding:calc(var(--safe-top) + 8px) 12px 8px; border-bottom:1px solid var(--border); }
    .editor-actions { display:flex; align-items:center; gap:4px; }
    .editor-body { flex:1; overflow-y:auto; padding:16px 18px calc(var(--safe-bottom) + 24px); display:flex; flex-direction:column; }
    .title-input { border:none; background:none; color:var(--text); font-size:24px; font-weight:800; outline:none; padding:4px 0; }
    .tags-input { border:none; background:none; color:var(--accent); font-size:14px; font-weight:600; outline:none; padding:8px 0; border-bottom:1px solid var(--border); }
    .content-input { flex:1; min-height:40vh; border:none; background:none; color:var(--text); font-size:17px;
      line-height:1.55; outline:none; resize:none; padding:14px 0; font-family:inherit; }
    .title-input::placeholder, .tags-input::placeholder, .content-input::placeholder { color:var(--text-dim); }
    .meta-line { color:var(--text-dim); font-size:12px; margin:8px 0 0; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-row">
        <h1 class="app-title">WorkNotes</h1>
        <button id="newNoteBtn" class="icon-btn primary" aria-label="New note">＋</button>
      </div>
      <div class="search-wrap">
        <input id="searchInput" class="search" type="search" placeholder="Search notes & tags" autocomplete="off" />
      </div>
      <nav id="tagFilter" class="tag-filter" aria-label="Filter by tag"></nav>
    </header>
    <main id="noteList" class="note-list" aria-live="polite"></main>
    <p id="emptyState" class="empty-state" hidden>
      No notes yet.<br />Tap <strong>＋</strong> to capture your first work note.
    </p>
  </div>

  <div id="editor" class="editor" hidden aria-hidden="true">
    <div class="editor-bar">
      <button id="backBtn" class="text-btn">‹ Notes</button>
      <div class="editor-actions">
        <button id="pinBtn" class="icon-btn" aria-label="Pin note" title="Pin">☆</button>
        <button id="deleteBtn" class="icon-btn danger" aria-label="Delete note" title="Delete">🗑</button>
        <button id="saveBtn" class="text-btn primary">Done</button>
      </div>
    </div>
    <div class="editor-body">
      <input id="titleInput" class="title-input" placeholder="Title" />
      <input id="tagsInput" class="tags-input" placeholder="Tags (comma separated)" autocomplete="off" />
      <textarea id="contentInput" class="content-input" placeholder="Start typing…&#10;&#10;Tip: lines starting with [ ] become checklist items."></textarea>
      <p id="metaLine" class="meta-line"></p>
    </div>
  </div>

  <script>
  /* WorkNotes — single-file build (storage falls back to memory if sandboxed) */
  (() => {
    'use strict';
    const STORAGE_KEY = 'worknotes.v1';
    const $ = (s) => document.querySelector(s);

    // Storage with graceful fallback (some sandboxes block localStorage)
    let memory = null;
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch { return memory || []; }
    }
    function save() {
      memory = notes;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch {}
    }

    let notes = load();
    let activeTag = null, query = '', editingId = null;

    const noteList = $('#noteList'), emptyState = $('#emptyState'),
      searchInput = $('#searchInput'), tagFilter = $('#tagFilter'), editor = $('#editor'),
      titleInput = $('#titleInput'), tagsInput = $('#tagsInput'), contentInput = $('#contentInput'),
      pinBtn = $('#pinBtn'), metaLine = $('#metaLine');

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const parseTags = (str) => [...new Set(str.split(',').map(t => t.trim().toLowerCase()).filter(Boolean))];

    function relativeTime(ts) {
      const d = (Date.now() - ts) / 1000;
      if (d < 60) return 'just now';
      if (d < 3600) return `${Math.floor(d/60)}m ago`;
      if (d < 86400) return `${Math.floor(d/3600)}h ago`;
      if (d < 604800) return `${Math.floor(d/86400)}d ago`;
      return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    const preview = (t) => t.replace(/\[[ x]\]/gi, '').replace(/\s+/g, ' ').trim();
    function allTags() { const s = new Set(); notes.forEach(n => n.tags.forEach(t => s.add(t))); return [...s].sort(); }

    function visibleNotes() {
      const q = query.toLowerCase();
      return notes
        .filter(n => !activeTag || n.tags.includes(activeTag))
        .filter(n => !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q) || n.tags.some(t => t.includes(q)))
        .sort((a, b) => (b.pinned - a.pinned) || (b.updated - a.updated));
    }

    function renderTags() {
      const tags = allTags();
      tagFilter.innerHTML = '';
      if (!tags.length) return;
      const mkChip = (label, value) => {
        const el = document.createElement('button');
        el.className = 'tag-chip' + (activeTag === value ? ' active' : '');
        el.textContent = label;
        el.addEventListener('click', () => { activeTag = activeTag === value ? null : value; render(); });
        return el;
      };
      tagFilter.appendChild(mkChip('All', null));
      tags.forEach(t => tagFilter.appendChild(mkChip('#' + t, t)));
    }

    function render() {
      renderTags();
      const list = visibleNotes();
      noteList.innerHTML = '';
      emptyState.hidden = notes.length !== 0;
      list.forEach(n => {
        const card = document.createElement('article');
        card.className = 'note-card';
        card.addEventListener('click', () => openEditor(n.id));
        const top = document.createElement('div'); top.className = 'nc-top';
        if (n.pinned) { const dot = document.createElement('span'); dot.className = 'pin-dot'; dot.textContent = '★'; top.appendChild(dot); }
        const h = document.createElement('h3'); h.textContent = n.title || 'Untitled'; top.appendChild(h);
        card.appendChild(top);
        const body = preview(n.content);
        if (body) { const p = document.createElement('p'); p.textContent = body; card.appendChild(p); }
        const meta = document.createElement('div'); meta.className = 'nc-meta';
        const time = document.createElement('time'); time.textContent = relativeTime(n.updated); meta.appendChild(time);
        n.tags.slice(0, 3).forEach(t => { const tag = document.createElement('span'); tag.className = 'nc-tag'; tag.textContent = '#' + t; meta.appendChild(tag); });
        card.appendChild(meta);
        noteList.appendChild(card);
      });
    }

    function openEditor(id) {
      const note = id ? notes.find(n => n.id === id) : null;
      editingId = note ? note.id : null;
      titleInput.value = note ? note.title : '';
      tagsInput.value = note ? note.tags.join(', ') : '';
      contentInput.value = note ? note.content : '';
      updatePinBtn(note ? note.pinned : false);
      metaLine.textContent = note ? `Created ${new Date(note.created).toLocaleString()} · Updated ${relativeTime(note.updated)}` : 'New note';
      editor.hidden = false; editor.setAttribute('aria-hidden', 'false');
      if (!note) setTimeout(() => titleInput.focus(), 80);
    }
    function updatePinBtn(pinned) {
      pinBtn.textContent = pinned ? '★' : '☆';
      pinBtn.classList.toggle('primary', pinned);
      pinBtn.dataset.pinned = pinned ? '1' : '';
    }
    function commitEditor() {
      const title = titleInput.value.trim(), content = contentInput.value,
        tags = parseTags(tagsInput.value), pinned = pinBtn.dataset.pinned === '1';
      const isEmpty = !title && !content.trim() && !tags.length;
      if (editingId) {
        const note = notes.find(n => n.id === editingId);
        if (isEmpty) notes = notes.filter(n => n.id !== editingId);
        else if (note) Object.assign(note, { title, content, tags, pinned, updated: Date.now() });
      } else if (!isEmpty) {
        const now = Date.now();
        notes.push({ id: uid(), title, content, tags, pinned, created: now, updated: now });
      }
      save(); closeEditor(); render();
    }
    function closeEditor() { editor.hidden = true; editor.setAttribute('aria-hidden', 'true'); editingId = null; }
    function deleteCurrent() {
      if (editingId && confirm('Delete this note?')) { notes = notes.filter(n => n.id !== editingId); save(); closeEditor(); render(); }
      else if (!editingId) closeEditor();
    }

    $('#newNoteBtn').addEventListener('click', () => openEditor(null));
    $('#backBtn').addEventListener('click', commitEditor);
    $('#saveBtn').addEventListener('click', commitEditor);
    $('#deleteBtn').addEventListener('click', deleteCurrent);
    pinBtn.addEventListener('click', () => updatePinBtn(pinBtn.dataset.pinned !== '1'));
    searchInput.addEventListener('input', (e) => { query = e.target.value; render(); });

    render();
  })();
  </script>
</body>
</html>
